version: '3.8'

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bitcentral-mcp-server
    restart: always
    ports:
      - "${MCP_PORT:-8082}:${MCP_PORT:-8082}"
    env_file:
      - .env
    environment:
      - PORT=${MCP_PORT:-8082}
      - MCP_TRANSPORT=sse
