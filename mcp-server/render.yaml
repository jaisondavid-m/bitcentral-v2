services:
  - type: web
    name: bitcentral-mcp-server
    env: docker
    rootDir: mcp-server
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: BACKEND_URL
        sync: false
        # Set this to your deployed Render backend URL e.g. https://bitcentral-backend.onrender.com
      - key: BACKEND_AUTH_TOKEN
        sync: false
