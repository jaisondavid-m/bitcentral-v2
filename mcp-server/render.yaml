services:
  - type: web
    name: bitcentral-mcp-server
    env: docker
    rootDir: mcp-server
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: BACKEND_URL
        sync: false
      - key: BACKEND_AUTH_TOKEN
        sync: false